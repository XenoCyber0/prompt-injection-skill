name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile examples/*.py tests/*.py
      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Smoke (listener + harness + score)
        run: |
          python examples/listener.py --port 8123 --quiet --out /tmp/hits.log &
          LISTENER=$!
          sleep 1
          python examples/run_harness.py --cases examples/cases.jsonl --url http://127.0.0.1:8123 --limit 2 --delay 0 --out /tmp/results.jsonl
          kill "$LISTENER" || true
          test "$(wc -l < /tmp/results.jsonl)" -eq 2
          test -s /tmp/hits.log
          python examples/score.py /tmp/results.jsonl || true
